services:
  postgres:
    image: postgres:17-alpine
    container_name: sigs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigs
      POSTGRES_USER: sigs_user
      POSTGRES_PASSWORD: sigs_password
    ports:
      - "5432:5432"
    volumes:
      - sigs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigs_user -d sigs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sigs_pgdata:
