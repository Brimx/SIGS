name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar
        run: dotnet restore Supermercado.slnx

      - name: Compilar
        run: dotnet build Supermercado.slnx --no-restore -c Release

      - name: Probar
        run: >
          dotnet test Supermercado.Pruebas/Supermercado.Pruebas.csproj
          --no-build -c Release
          --logger "trx;LogFileName=resultados.trx"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
